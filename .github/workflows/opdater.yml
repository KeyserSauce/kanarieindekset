# Henter de nyeste tal fra Danmarks Statistik én gang om måneden og lægger siden op på GitHub Pages.
name: Opdater og udgiv

on:
  schedule:
    - cron: "0 6 10 * *"  # den 10. i hver måned kl. 6 (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Byg data.json
        if: github.event_name != 'push'
        env:
          JOBINDSATS_API_KEY: ${{ secrets.JOBINDSATS_API_KEY }}
        run: python scripts/build.py
      - name: Gem nye tal i repoet
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Nye tal $(date +%Y-%m-%d)" && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
